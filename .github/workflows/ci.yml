name: Build Retro-Go

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target device to build (e.g., cyd, esp32-s3-devkit, esp32-p4-devkit, odroid-go, or "all")'
        required: true
        default: 'all'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Remove ~18 GiB of preinstalled software to have more disk space during the build
    - name: Cleanup runner
      run: |
        df -h
        sudo rm -rf /opt/microsoft /usr/local/.ghcup /usr/local/julia* /usr/share/dotnet /usr/share/swift /usr/lib/llvm*
        df -h

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker environment
      uses: docker/build-push-action@v6
      with:
        context: .
        tags: retro-go:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true

    - name: Compile target firmware image
      run: |
        mkdir -p output
        TARGET="${{ inputs.target }}"
        if [ "$TARGET" = "all" ]; then
          echo "Building all targets..."
          for target_path in components/retro-go/targets/*/; do
            t=$(basename "$target_path")
            if [ "$t" = "sdl2" ]; then
              continue
            fi
            echo "=========================================="
            echo "Building target: $t"
            echo "=========================================="
            docker run --rm -v $(pwd)/output:/output retro-go:latest bash -c ". /opt/esp/idf/export.sh && python rg_tool.py --target=$t release && cp *.img /output/ 2>/dev/null || true"
          done
        else
          echo "Building target: $TARGET"
          docker run --rm -v $(pwd)/output:/output retro-go:latest bash -c ". /opt/esp/idf/export.sh && python rg_tool.py --target=$TARGET release && cp *.img /output/ 2>/dev/null || true"
        fi

    - name: Upload firmware images
      uses: actions/upload-artifact@v4
      with:
        name: retro-go-images-${{ inputs.target }}
        path: output/*.img
        if-no-files-found: error

