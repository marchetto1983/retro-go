name: Build Retro-Go

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target device(s) to build (e.g., cyd, "cyd, gb300-p4", or "all")'
        required: true
        default: 'all'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Remove ~18 GiB of preinstalled software to have more disk space during the build
    - name: Cleanup runner
      run: |
        df -h
        sudo rm -rf /opt/microsoft /usr/local/.ghcup /usr/local/julia* /usr/share/dotnet /usr/share/swift /usr/lib/llvm*
        df -h

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker environment
      uses: docker/build-push-action@v6
      with:
        context: .
        tags: retro-go:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true

    - name: Compile target firmware image
      run: |
        mkdir -p output
        INPUT_TARGETS="${{ inputs.target }}"
        if [ "$INPUT_TARGETS" = "all" ]; then
          echo "Building all targets..."
          TARGETS=""
          for target_path in components/retro-go/targets/*/; do
            t=$(basename "$target_path")
            if [ "$t" != "sdl2" ]; then
              TARGETS="$TARGETS $t"
            fi
          done
        else
          # Replace commas with spaces to support comma-separated or space-separated lists
          TARGETS=$(echo "$INPUT_TARGETS" | tr ',' ' ')
        fi

        for t in $TARGETS; do
          # Trim whitespace
          t=$(echo "$t" | xargs)
          if [ -z "$t" ]; then
            continue
          fi
          
          # Detect if target is ESP32-P4 (which lacks Wi-Fi/networking)
          NO_NETWORKING=""
          if grep -q "esp32p4" "components/retro-go/targets/$t/env.py" 2>/dev/null; then
            NO_NETWORKING="--no-networking"
          fi

          echo "=========================================="
          echo "Building target: $t $NO_NETWORKING"
          echo "=========================================="
          docker run --rm -v $(pwd)/output:/output retro-go:latest bash -c ". /opt/esp/idf/export.sh && python rg_tool.py --target=$t $NO_NETWORKING release && cp *.img /output/ 2>/dev/null || true"
        done

    - name: Upload firmware images
      uses: actions/upload-artifact@v4
      with:
        name: retro-go-images
        path: output/*.img
        if-no-files-found: error

